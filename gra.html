<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PROJECTORA — Gra</title>

<style>
*{box-sizing:border-box}

:root{
  --bg:#080c19;
  --card:rgba(21,28,49,.88);
  --card2:#11182b;
  --border:#2b385d;
  --primary:#6c7cff;
  --primary2:#9b6cff;
  --green:#21d789;
  --red:#ff5570;
  --text:#fff;
  --muted:#aeb8d0;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:Inter,Arial,sans-serif;
  background:
    radial-gradient(circle at 15% 20%,rgba(108,124,255,.18),transparent 30%),
    radial-gradient(circle at 85% 80%,rgba(155,108,255,.15),transparent 30%),
    var(--bg);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
}

/* ANIMOWANE TŁO */

body::before,
body::after{
  content:"";
  position:fixed;
  width:350px;
  height:350px;
  border-radius:50%;
  filter:blur(100px);
  opacity:.18;
  pointer-events:none;
  z-index:-1;
}

body::before{
  background:#536dff;
  top:-150px;
  left:-120px;
  animation:float1 8s ease-in-out infinite;
}

body::after{
  background:#a855f7;
  right:-130px;
  bottom:-150px;
  animation:float2 10s ease-in-out infinite;
}

@keyframes float1{
  0%,100%{transform:translate(0,0)}
  50%{transform:translate(100px,80px)}
}

@keyframes float2{
  0%,100%{transform:translate(0,0)}
  50%{transform:translate(-80px,-70px)}
}

/* KONTENER */

.wrap{
  max-width:900px;
  margin:auto;
  padding:28px 18px;
  min-height:100vh;
  display:flex;
  align-items:center;
}

/* KARTA */

.card{
  width:100%;
  background:linear-gradient(
    145deg,
    rgba(25,33,57,.94),
    rgba(14,20,38,.94)
  );
  border:1px solid rgba(108,124,255,.2);
  border-radius:24px;
  padding:28px;
  box-shadow:
    0 25px 80px rgba(0,0,0,.45),
    inset 0 1px 0 rgba(255,255,255,.04);
  backdrop-filter:blur(18px);
  animation:cardIn .55s cubic-bezier(.2,.8,.2,1);
  position:relative;
  overflow:hidden;
}

.card::before{
  content:"";
  position:absolute;
  top:0;
  left:-100%;
  width:70%;
  height:1px;
  background:linear-gradient(
    90deg,
    transparent,
    #8190ff,
    transparent
  );
  animation:shine 5s linear infinite;
}

@keyframes shine{
  0%{left:-100%}
  50%,100%{left:150%}
}

@keyframes cardIn{
  from{
    opacity:0;
    transform:translateY(25px) scale(.97);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

.hidden{
  display:none!important;
}

/* NAPISY */

h1{
  margin:0 0 8px;
  font-size:32px;
  letter-spacing:-1px;
}

.muted{
  color:var(--muted);
}

/* INPUT */

input{
  width:100%;
  padding:15px;
  border-radius:12px;
  border:1px solid #34405f;
  background:#0d1426;
  color:#fff;
  font-size:17px;
  margin:7px 0;
  outline:none;
  transition:
    border .25s,
    box-shadow .25s,
    transform .25s;
}

input:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 4px rgba(108,124,255,.12);
  transform:translateY(-1px);
}

/* PRZYCISKI */

button{
  border:0;
  border-radius:12px;
  padding:14px 18px;
  font-weight:800;
  font-size:16px;
  cursor:pointer;
  background:linear-gradient(
    135deg,
    var(--primary),
    var(--primary2)
  );
  color:white;
  transition:
    transform .2s,
    box-shadow .2s,
    filter .2s;
}

button:hover:not(:disabled){
  transform:translateY(-3px);
  box-shadow:0 10px 25px rgba(108,124,255,.3);
  filter:brightness(1.08);
}

button:active:not(:disabled){
  transform:translateY(0) scale(.97);
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

/* UKŁAD */

.row{
  display:flex;
  gap:10px;
}

.row>*{
  flex:1;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.pill{
  padding:9px 13px;
  border-radius:999px;
  background:#222c49;
  color:#dbe2ff;
  border:1px solid rgba(108,124,255,.15);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
}

/* TIMER */

.timer{
  font-size:42px;
  font-weight:900;
  text-align:center;
  margin:15px 0 8px;
  font-variant-numeric:tabular-nums;
  text-shadow:0 0 25px rgba(108,124,255,.4);
  transition:color .2s,transform .2s;
}

.timer.warning{
  color:#ffca3a;
  animation:timerPulse .7s infinite;
}

.timer.danger{
  color:#ff5570;
  animation:timerPulse .35s infinite;
}

@keyframes timerPulse{
  0%,100%{
    transform:scale(1);
  }
  50%{
    transform:scale(1.1);
  }
}

/* PASEK CZASU */

.bar{
  height:10px;
  background:#27304a;
  border-radius:99px;
  overflow:hidden;
  box-shadow:inset 0 1px 4px #0008;
}

.bar>div{
  height:100%;
  width:100%;
  background:linear-gradient(
    90deg,
    #9b6cff,
    #6c7cff,
    #4de3ff
  );
  border-radius:99px;
  transition:width .1s linear;
  box-shadow:0 0 15px rgba(108,124,255,.6);
}

/* PYTANIE */

.question{
  font-size:25px;
  font-weight:800;
  margin:25px 0;
  line-height:1.3;
  animation:questionIn .45s cubic-bezier(.2,.8,.2,1);
}

@keyframes questionIn{
  from{
    opacity:0;
    transform:translateX(-20px);
  }
  to{
    opacity:1;
    transform:translateX(0);
  }
}

/* ODPOWIEDZI */

.answers{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.answer{
  min-height:75px;
  text-align:left;
  background:linear-gradient(
    145deg,
    #202a45,
    #182139
  );
  border:2px solid #34405f;
  position:relative;
  overflow:hidden;
  animation:answerIn .4s both;
}

.answer:nth-child(1){animation-delay:.04s}
.answer:nth-child(2){animation-delay:.08s}
.answer:nth-child(3){animation-delay:.12s}
.answer:nth-child(4){animation-delay:.16s}

@keyframes answerIn{
  from{
    opacity:0;
    transform:translateY(15px) scale(.97);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

.answer::after{
  content:"";
  position:absolute;
  width:0;
  height:0;
  border-radius:50%;
  background:rgba(255,255,255,.15);
  transform:translate(-50%,-50%);
  transition:width .5s,height .5s;
}

.answer:hover:not(:disabled)::after{
  width:300px;
  height:300px;
}

.answer.correct{
  background:linear-gradient(135deg,#18794e,#11633f);
  border-color:#48e08f;
  animation:correctPop .45s;
}

.answer.wrong{
  background:linear-gradient(135deg,#8b2c3b,#6e2231);
  border-color:#ff7185;
  animation:wrongShake .4s;
}

@keyframes correctPop{
  0%{transform:scale(1)}
  50%{transform:scale(1.05)}
  100%{transform:scale(1)}
}

@keyframes wrongShake{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-8px)}
  75%{transform:translateX(8px)}
}

/* FEEDBACK */

.feedback{
  text-align:center;
  font-size:20px;
  font-weight:800;
  margin-top:15px;
  min-height:28px;
  animation:feedbackIn .3s;
}

@keyframes feedbackIn{
  from{
    opacity:0;
    transform:scale(.8);
  }
  to{
    opacity:1;
    transform:scale(1);
  }
}

/* PODIUM */

.podium{
  display:flex;
  align-items:end;
  justify-content:center;
  gap:12px;
  height:280px;
  margin-top:25px;
}

.place{
  width:28%;
  text-align:center;
  animation:podiumIn .7s cubic-bezier(.2,.8,.2,1) both;
}

.p1{animation-delay:.2s}
.p2{animation-delay:.45s}
.p3{animation-delay:.7s}

@keyframes podiumIn{
  from{
    opacity:0;
    transform:translateY(100px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.block{
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:14px 14px 0 0;
  font-size:30px;
  font-weight:900;
  background:linear-gradient(
    180deg,
    #34405f,
    #222b46
  );
  box-shadow:
    0 10px 25px rgba(0,0,0,.25),
    inset 0 1px 0 rgba(255,255,255,.08);
}

.p1 .block{
  height:170px;
  background:linear-gradient(180deg,#e8b93f,#9e7315);
  box-shadow:0 0 35px rgba(232,185,63,.2);
}

.p2 .block{
  height:125px;
  background:linear-gradient(180deg,#cfd7e6,#69768c);
}

.p3 .block{
  height:90px;
  background:linear-gradient(180deg,#c88655,#75442c);
}

.name{
  font-weight:800;
  margin:8px 0;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.score{
  color:#aeb8d0;
}

/* OCZEKIWANIE */

#wait .status{
  animation:waitingPulse 2s infinite;
}

@keyframes waitingPulse{
  0%,100%{opacity:.55}
  50%{opacity:1}
}

/* STATUS */

.status{
  text-align:center;
  margin-top:20px;
}

/* RESPONSIVE */

@media(max-width:650px){

  .wrap{
    padding:15px;
  }

  .card{
    padding:22px 17px;
    border-radius:20px;
  }

  h1{
    font-size:27px;
  }

  .answers{
    grid-template-columns:1fr;
  }

  .row{
    flex-direction:column;
  }

  .top{
    align-items:flex-start;
  }

  .question{
    font-size:21px;
  }

  .timer{
    font-size:38px;
  }

  .podium{
    gap:7px;
  }

  .place{
    width:31%;
  }
}

/* REDUKCJA ANIMACJI DLA OSÓB, KTÓRE TEGO POTRZEBUJĄ */

@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }
}
</style>
</head>

function seed(s){

 let h = 2166136261;

 for(let i=0;i<s.length;i++){

  h ^= s.charCodeAt(i);
  h = Math.imul(h,16777619);

 }

 return h >>> 0;
}


function shuffle(arr,sv){

 let a = arr.slice();
 let x = sv >>> 0;

 for(let i=a.length-1;i>0;i--){

  x =
   (Math.imul(x,1664525)+1013904223)

  let j = x%(i+1);

  [a[i],a[j]] =

 }

 return a;

   box.appendChild(b);

  }
 );


 deadline =
  Date.now()+15000;

/* TIMER */

function tick(){

 const left =
  Math.max(
   0,
   deadline-Date.now()
  );


 const seconds =
  left/1000;


 $("timer").textContent =
  seconds.toFixed(1);


 $("timerBar").style.width =
  (left/150)+"%";


 const timer =
  $("timer");


 timer.classList.remove(
  "warning",
  "danger"
 );


 if(seconds<=5){

  timer.classList.add("danger");

 }
 else if(seconds<=8){

  timer.classList.add("warning");

 }


 if(left<=0){

  clearInterval(timerId);

  timeoutQuestion();

 }

}
