<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PROJECTORA — Gra</title>

<style>
*{box-sizing:border-box}

:root{
  --bg:#f1f5f9;
  --card:#ffffff;
  --card2:#f8fafc;
  --border:#cbd5e1;
  --primary:#2563eb;
  --primary2:#4f46e5;
  --green:#059669;
  --red:#dc2626;
  --text:#0f172a;
  --muted:#475569;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:Inter,Arial,sans-serif;
  background:
    radial-gradient(circle at 15% 20%,rgba(37,99,235,.07),transparent 35%),
    radial-gradient(circle at 85% 80%,rgba(79,70,229,.07),transparent 35%),
    var(--bg);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
}

body::before,
body::after{
  content:"";
  position:fixed;
  width:350px;
  height:350px;
  border-radius:50%;
  filter:blur(90px);
  opacity:.14;
  pointer-events:none;
  z-index:-1;
}

body::before{
  background:#3b82f6;
  top:-150px;
  left:-120px;
  animation:float1 8s ease-in-out infinite;
}

body::after{
  background:#6366f1;
  right:-130px;
  bottom:-150px;
  animation:float2 10s ease-in-out infinite;
}

@keyframes float1{
  0%,100%{transform:translate(0,0)}
  50%{transform:translate(100px,80px)}
}

@keyframes float2{
  0%,100%{transform:translate(0,0)}
  50%{transform:translate(-80px,-70px)}
}

.wrap{
  max-width:900px;
  margin:auto;
  padding:28px 18px;
  min-height:100vh;
  display:flex;
  align-items:center;
}

.card{
  width:100%;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:24px;
  padding:32px;
  box-shadow:
    0 15px 35px rgba(15,23,42,.06),
    0 3px 10px rgba(15,23,42,.04);
  animation:cardIn .55s cubic-bezier(.2,.8,.2,1);
  position:relative;
  overflow:hidden;
}

.card::before{
  content:"";
  position:absolute;
  top:0;
  left:-100%;
  width:70%;
  height:2px;
  background:linear-gradient(
    90deg,
    transparent,
    var(--primary),
    transparent
  );
  animation:shine 5s linear infinite;
}

@keyframes shine{
  0%{left:-100%}
  50%,100%{left:150%}
}

@keyframes cardIn{
  from{
    opacity:0;
    transform:translateY(20px) scale(.98);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

.hidden{
  display:none!important;
}

h1{
  margin:0 0 8px;
  font-size:32px;
  letter-spacing:-1px;
  color:#0f172a;
}

.muted{
  color:var(--muted);
}

input{
  width:100%;
  padding:15px;
  border-radius:12px;
  border:1px solid #cbd5e1;
  background:#f8fafc;
  color:#0f172a;
  font-size:17px;
  margin:8px 0;
  outline:none;
  transition:
    border .25s,
    box-shadow .25s,
    background .25s;
}

input:focus{
  background:#ffffff;
  border-color:var(--primary);
  box-shadow:0 0 0 4px rgba(37,99,235,.15);
}

button{
  border:0;
  border-radius:12px;
  padding:14px 18px;
  font-weight:800;
  font-size:16px;
  cursor:pointer;
  background:linear-gradient(
    135deg,
    var(--primary),
    var(--primary2)
  );
  color:#ffffff;
  transition:
    transform .2s,
    box-shadow .2s,
    filter .2s;
}

button:hover:not(:disabled){
  transform:translateY(-2px);
  box-shadow:0 8px 20px rgba(37,99,235,.25);
  filter:brightness(1.05);
}

button:active:not(:disabled){
  transform:translateY(0) scale(.98);
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.row{
  display:flex;
  gap:10px;
}

.row>*{
  flex:1;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.pill{
  padding:9px 15px;
  border-radius:999px;
  background:#e2e8f0;
  color:#1e293b;
  font-weight:700;
  border:1px solid #cbd5e1;
}

.timer{
  font-size:44px;
  font-weight:900;
  text-align:center;
  margin:15px 0 8px;
  font-variant-numeric:tabular-nums;
  color:#0f172a;
  transition:color .2s,transform .2s;
}

.timer.warning{
  color:#d97706;
  animation:timerPulse .7s infinite;
}

.timer.danger{
  color:var(--red);
  animation:timerPulse .35s infinite;
}

@keyframes timerPulse{
  0%,100%{
    transform:scale(1);
  }
  50%{
    transform:scale(1.08);
  }
}

.bar{
  height:10px;
  background:#e2e8f0;
  border-radius:99px;
  overflow:hidden;
}

.bar>div{
  height:100%;
  width:100%;
  background:linear-gradient(
    90deg,
    #4f46e5,
    #2563eb,
    #06b6d4
  );
  border-radius:99px;
  transition:width .1s linear;
}

.question{
  font-size:24px;
  font-weight:800;
  color:#0f172a;
  margin:25px 0;
  line-height:1.35;
  animation:questionIn .45s cubic-bezier(.2,.8,.2,1);
}

@keyframes questionIn{
  from{
    opacity:0;
    transform:translateX(-15px);
  }
  to{
    opacity:1;
    transform:translateX(0);
  }
}

.answers{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.answer{
  min-height:75px;
  text-align:left;
  background:#ffffff;
  color:#1e293b;
  border:2px solid #cbd5e1;
  border-radius:14px;
  position:relative;
  overflow:hidden;
  animation:answerIn .4s both;
  font-weight:600;
}

.answer:hover:not(:disabled){
  border-color:#93c5fd;
  background:#f8fafc;
  color:#0f172a;
  transform:translateY(-2px);
}

.answer:nth-child(1){animation-delay:.04s}
.answer:nth-child(2){animation-delay:.08s}
.answer:nth-child(3){animation-delay:.12s}
.answer:nth-child(4){animation-delay:.16s}

@keyframes answerIn{
  from{
    opacity:0;
    transform:translateY(12px) scale(.98);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

.answer.correct{
  background:#ecfdf5!important;
  border-color:#10b981!important;
  color:#065f46!important;
  animation:correctPop .45s;
}

.answer.wrong{
  background:#fef2f2!important;
  border-color:#ef4444!important;
  color:#991b1b!important;
  animation:wrongShake .4s;
}

@keyframes correctPop{
  0%{transform:scale(1)}
  50%{transform:scale(1.03)}
  100%{transform:scale(1)}
}

@keyframes wrongShake{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-6px)}
  75%{transform:translateX(6px)}
}

.feedback{
  text-align:center;
  font-size:20px;
  font-weight:800;
  margin-top:15px;
  min-height:28px;
  animation:feedbackIn .3s;
}

@keyframes feedbackIn{
  from{
    opacity:0;
    transform:scale(.85);
  }
  to{
    opacity:1;
    transform:scale(1);
  }
}

.podium{
  display:flex;
  align-items:end;
  justify-content:center;
  gap:12px;
  height:280px;
  margin-top:25px;
}

.place{
  width:28%;
  text-align:center;
  animation:podiumIn .7s cubic-bezier(.2,.8,.2,1) both;
}

.p1{animation-delay:.2s}
.p2{animation-delay:.45s}
.p3{animation-delay:.7s}

@keyframes podiumIn{
  from{
    opacity:0;
    transform:translateY(80px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.block{
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:14px 14px 0 0;
  font-size:30px;
  font-weight:900;
  color:#ffffff;
  background:#94a3b8;
  box-shadow:0 8px 18px rgba(15,23,42,.08);
}

.p1 .block{
  height:170px;
  background:linear-gradient(180deg,#f59e0b,#d97706);
}

.p2 .block{
  height:125px;
  background:linear-gradient(180deg,#94a3b8,#64748b);
}

.p3 .block{
  height:90px;
  background:linear-gradient(180deg,#b45309,#78350f);
}

.name{
  font-weight:800;
  color:#0f172a;
  margin:8px 0;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.score{
  color:var(--muted);
  font-weight:700;
}

#wait .status{
  animation:waitingPulse 2s infinite;
}

@keyframes waitingPulse{
  0%,100%{opacity:.6}
  50%{opacity:1}
}

.status{
  text-align:center;
  margin-top:20px;
  color:#475569;
}

@media(max-width:650px){
  .wrap{
    padding:15px;
  }
  .card{
    padding:22px 18px;
    border-radius:20px;
  }
  h1{
    font-size:26px;
  }
  .answers{
    grid-template-columns:1fr;
  }
  .row{
    flex-direction:column;
  }
  .top{
    align-items:flex-start;
  }
  .question{
    font-size:20px;
  }
  .timer{
    font-size:36px;
  }
  .podium{
    gap:7px;
  }
  .place{
    width:31%;
  }
}

@media(prefers-reduced-motion:reduce){
  *,
  *::before,
  *::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <!-- JOIN -->
  <div id="join" class="card">
    <h1>PROJECTORA</h1>
    <div class="muted">
      Quiz — dołącz do pokoju
    </div>

    <input
      id="code"
      placeholder="Kod pokoju"
      autocomplete="off"
    >

    <input
      id="nick"
      placeholder="Twój nick"
      maxlength="24"
      autocomplete="off"
    >

    <button id="joinBtn">
      DOŁĄCZ
    </button>

    <div id="joinMsg" class="status muted"></div>
  </div>

  <!-- WAIT -->
  <div id="wait" class="card hidden">
    <div class="top">
      <div>
        <h1>Czekamy na start</h1>
        <div id="hello" class="muted"></div>
      </div>
      <div class="pill" id="roomPill"></div>
    </div>
    <div class="status">
      Prowadzący uruchomi quiz.
      Nie zamykaj tej strony.
    </div>
  </div>

  <!-- QUIZ -->
  <div id="quiz" class="card hidden">
    <div class="top">
      <div class="pill" id="progress">
        Pytanie
      </div>
      <div class="pill" id="points">
        0 pkt
      </div>
    </div>

    <div class="timer" id="timer">
      15.0
    </div>

    <div class="bar">
      <div id="timerBar"></div>
    </div>

    <div class="question" id="question"></div>
    <div class="answers" id="answers"></div>
    <div class="feedback" id="feedback"></div>
  </div>

  <!-- FINISHED -->
  <div id="finished" class="card hidden">
    <h1>Gotowe! 🎉</h1>
    <div class="status muted">
      Czekamy, aż wszyscy zakończą quiz...
    </div>
    <div class="status" id="waitInfo"></div>
  </div>

  <!-- PODIUM -->
  <div id="podium" class="card hidden">
    <h1 style="text-align:center">
      WYNIKI 🏆
    </h1>
    <div class="podium" id="podiumInner"></div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://megktvolzzqkeykzjkhe.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_qL5wS3xcDN8CbnUQ-Uvusw_zVxoBOMH";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const QUESTION_BANK = [
{ q:"Co przedstawia harmonogram projektu?", a:["Plan działań w czasie","Wyłącznie listę kosztów","Listę sponsorów","Opis pracowników"], c:0 },
{ q:"Czym jest wykres Gantta?", a:["Graficznym przedstawieniem zadań w czasie","Budżetem projektu","Listą zasobów","Spisem sponsorów"], c:0 },
{ q:"Co powinno uwzględniać realistyczne oszacowanie czasu?", a:["Możliwe nieprzewidziane zdarzenia","Tylko czas idealny","Wyłącznie weekendy","Tylko termin końcowy"], c:0 },
{ q:"Czym są kamienie milowe?", a:["Punktami kontrolnymi projektu","Kosztami pośrednimi","Źródłami finansowania","Rodzajem zasobu"], c:0 },
{ q:"Ile kamieni milowych zaleca się co najmniej wyznaczyć?", a:["Dwa — w połowie i na końcu","Jeden po każdym zadaniu","Tylko jeden na początku","Nie trzeba żadnego"], c:0 },
{ q:"Co zawiera budżet projektu?", a:["Wydatki i źródła finansowania","Tylko wynagrodzenia","Tylko sponsorów","Wyłącznie materiały"], c:0 },
{ q:"Który przykład jest zasobem ludzkim?", a:["Członkowie zespołu","Laptop","Dotacja","Licencja"], c:0 },
{ q:"Na czym polega szacowanie bottom-up?", a:["Koszty szacuje się od poszczególnych zadań i składa w całość","Podaje się jedną kwotę bez analizy","Liczy się tylko koszty pośrednie","Pomija się zadania"], c:0 },
{ q:"Który koszt jest kosztem bezpośrednim?", a:["Koszt bezpośrednio związany z wykonaniem konkretnego zadania","Ogólne koszty administracji firmy","Koszt niezwiązany z projektem","Opłata członkowska"], c:0 },
{ q:"Które źródło może finansować projekt komercyjny?", a:["Budżet firmy","Wyłącznie zbiórka publiczna","Tylko składki członkowskie","Tylko darowizny"], c:0 },
{ q:"Które źródło jest typowe dla projektu społecznego?", a:["Crowdfunding lub darowizny","Emisja akcji obowiązkowo","Tylko kredyt bankowy","Wyłącznie budżet firmy"], c:0 },
{ q:"Dlaczego budżet projektu może się zmienić?", a:["Np. przez zmianę zakresu lub cen","Nigdy się nie zmienia","Tylko przez zmianę nicku","Wyłącznie przez zmianę grafiki"], c:0 }
];

const $ = id => document.getElementById(id);

let roomCode = "";
let player = null;
let questions = [];
let pos = 0;
let score = 0;
let answered = false;
let deadline = 0;
let timerId = null;
let pollId = null;

// Automatyczne odczytywanie kodu z adresu URL (np. po zeskanowaniu QR kodu)
window.addEventListener("DOMContentLoaded", () => {
  const params = new URLSearchParams(window.location.search);
  const codeParam = params.get("code") || params.get("room");
  if (codeParam) {
    $("code").value = codeParam.trim().toUpperCase();
    $("nick").focus();
  }
});

function seed(s){
  let h = 2166136261;
  for(let i=0;i<s.length;i++){
    h ^= s.charCodeAt(i);
    h = Math.imul(h,16777619);
  }
  return h >>> 0;
}

function shuffle(arr,sv){
  let a = arr.slice();
  let x = sv >>> 0;
  for(let i=a.length-1;i>0;i--){
    x = (Math.imul(x,1664525)+1013904223) >>> 0;
    let j = x%(i+1);
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function show(id){
  ["join","wait","quiz","finished","podium"].forEach(x=>{
    const el = $(x);
    if(el) el.classList.toggle("hidden", x!==id);
  });
}

function msg(t){
  if($("joinMsg")) $("joinMsg").textContent=t;
}

function esc(s){
  return String(s).replace(/[&<>"']/g, m=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[m]));
}

$("joinBtn").onclick = join;
$("code").onkeydown = e => { if(e.key==="Enter") join(); };
$("nick").onkeydown = e => { if(e.key==="Enter") join(); };

async function join(){
  roomCode = $("code").value.trim().toUpperCase();
  const nick = $("nick").value.trim();

  if(!roomCode || !nick){
    msg("Wpisz kod pokoju i nick.");
    return;
  }

  msg("Dołączanie...");

  const { data:r, error:re } = await sb
    .from("rooms")
    .select("code,status,current_question")
    .eq("code",roomCode)
    .maybeSingle();

  if(re){ msg("Błąd pokoju: "+re.message); return; }
  if(!r){ msg("Nie znaleziono pokoju."); return; }
  if(r.status!=="lobby"){ msg("Ten quiz już się rozpoczął."); return; }

  const { data:p, error:pe } = await sb
    .from("players")
    .insert({ room_code:roomCode, nickname:nick, score:0, finished:false })
    .select("id,room_code,nickname,score,finished")
    .single();

  if(pe){ msg("Nie udało się dołączyć: "+pe.message); return; }

  player = p;
  $("hello").textContent = "Grasz jako: " + nick;
  $("roomPill").textContent = roomCode;

  show("wait");
  startRoomPolling();
}

function startRoomPolling(){
  clearInterval(pollId);
  pollId = setInterval(checkRoom, 500);
  checkRoom();
}

async function checkRoom(){
  const { data:r, error } = await sb
    .from("rooms")
    .select("code,status,current_question")
    .eq("code",roomCode)
    .maybeSingle();

  if(error || !r) return;

  if(r.status==="playing"){
    clearInterval(pollId);
    beginQuiz();
  }
  if(r.status==="finished"){
    clearInterval(pollId);
    showPodium();
  }
}

function beginQuiz(){
  questions = shuffle(QUESTION_BANK, seed(roomCode+":"+player.id));
  pos = 0;
  score = 0;
  show("quiz");
  renderQuestion();
}

function renderQuestion(){
  if(pos>=questions.length){
    finishPlayer();
    return;
  }

  answered = false;
  $("feedback").textContent = "";

  const q = questions[pos];
  const order = shuffle(
    q.a.map((text,i)=>({text,i})),
    seed(roomCode+":"+player.id+":"+pos+":"+q.q)
  );

  $("progress").textContent = `Pytanie ${pos+1}/${questions.length}`;
  $("points").textContent = `${score} pkt`;

  const questionEl = $("question");
  questionEl.style.animation = "none";
  void questionEl.offsetWidth;
  questionEl.style.animation = "questionIn .45s cubic-bezier(.2,.8,.2,1)";
  questionEl.textContent = q.q;

  const box = $("answers");
  box.innerHTML = "";

  order.forEach((item,i)=>{
    const b = document.createElement("button");
    b.className = "answer";
    b.textContent = item.text;
    b.dataset.idx = item.i;
    b.style.animationDelay = `${i*0.04}s`;
    b.onclick = () => answer(b, item.i, q.c);
    box.appendChild(b);
  });

  deadline = Date.now()+15000;
  clearInterval(timerId);
  timerId = setInterval(tick, 100);
  tick();
}

function tick(){
  const left = Math.max(0, deadline-Date.now());
  const seconds = left/1000;

  $("timer").textContent = seconds.toFixed(1);
  $("timerBar").style.width = (left/150)+"%";

  const timer = $("timer");
  timer.classList.remove("warning","danger");

  if(seconds<=5){
    timer.classList.add("danger");
  } else if(seconds<=8){
    timer.classList.add("warning");
  }

  if(left<=0){
    clearInterval(timerId);
    timeoutQuestion();
  }
}

async function answer(btn, index, correct){
  if(answered) return;
  answered = true;
  clearInterval(timerId);

  document.querySelectorAll(".answer").forEach(b=>b.disabled=true);

  const ok = index===correct;
  btn.classList.add(ok ? "correct" : "wrong");

  if(!ok){
    document.querySelectorAll(".answer").forEach(b=>{
      if(Number(b.dataset.idx)===correct) b.classList.add("correct");
    });
  }

  $("feedback").textContent = ok ? "✓ Dobrze! +100 pkt" : "✗ Błędna odpowiedź";
  if(ok) score += 100;
  $("points").textContent = `${score} pkt`;

  await sb.from("answers").insert({
    room_code:roomCode,
    player_id:player.id,
    question_index:pos,
    answer_index:index,
    correct:ok
  });

  await sb.from("players").update({score}).eq("id",player.id).eq("room_code",roomCode);

  setTimeout(()=>{
    pos++;
    renderQuestion();
  }, 650);
}

async function timeoutQuestion(){
  if(answered) return;
  answered = true;

  document.querySelectorAll(".answer").forEach(b=>b.disabled=true);
  $("feedback").textContent = "⏰ Czas minął!";

  const q = questions[pos];
  document.querySelectorAll(".answer").forEach(b=>{
    if(Number(b.dataset.idx)===q.c) b.classList.add("correct");
  });

  await sb.from("answers").insert({
    room_code:roomCode,
    player_id:player.id,
    question_index:pos,
    answer_index:-1,
    correct:false
  });

  setTimeout(()=>{
    pos++;
    renderQuestion();
  }, 300);
}

async function finishPlayer(){
  clearInterval(timerId);
  show("finished");

  const { error } = await sb
    .from("players")
    .update({ finished:true, finished_at:new Date().toISOString(), score })
    .eq("id",player.id)
    .eq("room_code",roomCode);

  if(error){
    $("waitInfo").textContent = "Błąd zapisu: " + error.message;
    return;
  }

  clearInterval(pollId);
  pollId = setInterval(checkFinished, 500);
  checkFinished();
}

async function checkFinished(){
  const { data:r } = await sb
    .from("rooms")
    .select("code,status")
    .eq("code",roomCode)
    .maybeSingle();

  if(r && r.status==="finished"){
    clearInterval(pollId);
    showPodium();
    return;
  }

  const { data:ps, error } = await sb
    .from("players")
    .select("id,finished")
    .eq("room_code",roomCode);

  if(error || !ps) return;

  const total = ps.length;
  const done = ps.filter(x=>x.finished).length;

  $("waitInfo").textContent = `Ukończyło: ${done}/${total}`;

  if(total>0 && done===total){
    clearInterval(pollId);
    await sb.from("rooms").update({status:"finished"}).eq("code",roomCode);
    showPodium();
  }
}

async function showPodium(){
  show("podium");

  const { data:ps, error } = await sb
    .from("players")
    .select("nickname,score")
    .eq("room_code",roomCode)
    .order("score",{ascending:false})
    .limit(3);

  if(error || !ps) return;

  const labels = ["🥇","🥈","🥉"];
  const classes = ["p1","p2","p3"];
  const box = $("podiumInner");
  box.innerHTML = "";

  ps.forEach((p,i)=>{
    const d = document.createElement("div");
    d.className = "place " + classes[i];
    d.innerHTML = `
      <div class="name">${labels[i]} ${esc(p.nickname)}</div>
      <div class="block">${i+1}</div>
      <div class="score">${p.score} pkt</div>
    `;
    box.appendChild(d);
  });
}
</script>
