<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROJECTORA — Prowadzący</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    min-height: 100%;
}

body {
    min-height: 100vh;
    font-family: Inter, Arial, sans-serif;
    color: #0f172a;
    overflow-x: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background:
        radial-gradient(circle at 20% 20%, rgba(37,99,235,.07), transparent 35%),
        radial-gradient(circle at 80% 80%, rgba(79,70,229,.07), transparent 35%),
        #f1f5f9;
}

body::before,
body::after {
    content: "";
    position: fixed;
    width: 420px;
    height: 420px;
    border-radius: 50%;
    filter: blur(90px);
    opacity: .15;
    z-index: -1;
    pointer-events: none;
}

body::before {
    background: #3b82f6;
    top: -180px;
    left: -150px;
    animation: floatOne 9s ease-in-out infinite alternate;
}

body::after {
    background: #6366f1;
    right: -180px;
    bottom: -180px;
    animation: floatTwo 11s ease-in-out infinite alternate;
}

@keyframes floatOne {
    from { transform: translate(0, 0) scale(1); }
    to { transform: translate(100px, 80px) scale(1.2); }
}

@keyframes floatTwo {
    from { transform: translate(0, 0) scale(1); }
    to { transform: translate(-100px, -80px) scale(1.25); }
}

.panel {
    width: min(100%, 960px);
    margin: auto;
    text-align: center;
    animation: panelIn .8s cubic-bezier(.2,.8,.2,1);
}

@keyframes panelIn {
    from { opacity: 0; transform: translateY(30px) scale(.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

#lobby,
#running,
#results {
    width: 100%;
    background: #ffffff;
    border: 1px solid #cbd5e1;
    border-radius: 28px;
    padding: 40px 32px;
    box-shadow:
        0 15px 35px rgba(15,23,42,.07),
        0 3px 10px rgba(15,23,42,.04);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    animation: sectionIn .6s ease;
}

@keyframes sectionIn {
    from { opacity: 0; transform: scale(.98); }
    to { opacity: 1; transform: scale(1); }
}

.hidden {
    display: none !important;
}

h1 {
    margin: 0 0 10px;
    font-size: clamp(28px, 5vw, 40px);
    font-weight: 900;
    color: #0f172a;
}

h2 {
    margin: 14px 0;
    color: #1e293b;
}

p {
    line-height: 1.5;
    color: #334155;
}

#status {
    color: #64748b;
    min-height: 24px;
    font-weight: 600;
}

.code {
    display: inline-block;
    font-size: clamp(42px, 10vw, 70px);
    font-weight: 900;
    letter-spacing: clamp(5px, 2vw, 10px);
    color: #2563eb;
    animation: codePulse 2.2s ease-in-out infinite;
}

@keyframes codePulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.03); }
}

#qrcode {
    margin: 20px auto;
    padding: 14px;
    background: #ffffff;
    border: 1px solid #cbd5e1;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 248px;
    min-height: 248px;
    box-shadow: 0 10px 25px rgba(15,23,42,.08);
}

#joinUrl {
    color: #2563eb;
    font-size: 14px;
    font-weight: 600;
    max-width: 100%;
    word-break: break-all;
}

.players {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 12px;
    margin: 20px 0;
}

.player {
    background: #f8fafc;
    border: 1px solid #cbd5e1;
    color: #0f172a;
    border-radius: 14px;
    padding: 14px;
    font-weight: 700;
    box-shadow: 0 2px 8px rgba(15,23,42,.04);
    animation: playerIn .45s cubic-bezier(.2,.8,.2,1);
    transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
}

.player:hover {
    transform: translateY(-3px);
    border-color: #93c5fd;
    box-shadow: 0 6px 16px rgba(37,99,235,.1);
}

@keyframes playerIn {
    from { opacity: 0; transform: translateY(12px) scale(.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

button {
    border: 0;
    border-radius: 14px;
    padding: 15px 28px;
    font-weight: 800;
    font-size: 16px;
    cursor: pointer;
    color: white;
    background: linear-gradient(135deg, #2563eb, #4f46e5);
    box-shadow: 0 8px 20px rgba(37,99,235,.25);
    transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
}

button:hover:not(:disabled) {
    transform: translateY(-2px) scale(1.02);
    box-shadow: 0 12px 28px rgba(37,99,235,.35);
}

button:active:not(:disabled) {
    transform: translateY(0) scale(.98);
}

button:disabled {
    opacity: .45;
    cursor: not-allowed;
    box-shadow: none;
}

#running {
    min-height: 420px;
}

#runInfo {
    color: #0f172a;
    font-size: 26px;
}

#finishInfo {
    color: #64748b;
    font-weight: 600;
}

#podium {
    width: 100%;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 18px;
    min-height: 300px;
    margin-top: 25px;
}

.place {
    width: 28%;
    max-width: 220px;
    text-align: center;
    animation: podiumIn .8s cubic-bezier(.2,.8,.2,1);
}

.place:nth-child(1) { animation-delay: .1s; }
.place:nth-child(2) { animation-delay: .25s; }
.place:nth-child(3) { animation-delay: .4s; }

@keyframes podiumIn {
    from { opacity: 0; transform: translateY(80px) scale(.85); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

.block {
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 16px 16px 0 0;
    font-size: 32px;
    font-weight: 900;
    color: white;
    box-shadow: 0 8px 20px rgba(15,23,42,.1);
}

.p1 .block {
    height: 180px;
    background: linear-gradient(180deg, #f59e0b, #d97706);
}

.p2 .block {
    height: 135px;
    background: linear-gradient(180deg, #94a3b8, #64748b);
}

.p3 .block {
    height: 100px;
    background: linear-gradient(180deg, #b45309, #78350f);
}

.name {
    font-weight: 800;
    color: #0f172a;
    margin: 10px 0;
    word-break: break-word;
}

.score {
    color: #64748b;
    font-weight: 700;
}

@media (max-width: 600px) {
    body { padding: 12px; }
    #lobby, #running, #results { padding: 28px 18px; border-radius: 22px; }
    .players { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    #qrcode { transform: scale(.9); }
    #podium { gap: 8px; }
    .place { width: 31%; }
    .p1 .block { height: 150px; }
    .p2 .block { height: 110px; }
    .p3 .block { height: 80px; }
}
</style>
</head>

<body>

<div class="panel">

    <section id="lobby">
        <h1>🎮 QUIZ KLASOWY</h1>
        <p id="status">Łączenie z bazą pokoju...</p>
        <div id="qrcode"></div>
        <p><b>📱 ZESKANUJ KOD, ABY DOŁĄCZYĆ DO QUIZU</b></p>
        <p id="joinUrl"></p>
        <h2>KOD: <span id="code" class="code">------</span></h2>
        <h2>👥 <span id="playerCount">0 graczy</span></h2>
        <div id="players" class="players"></div>
        <button id="start" disabled>▶ ROZPOCZNIJ QUIZ</button>
    </section>

    <section id="running" class="hidden">
        <h1>🎯 QUIZ TRWA</h1>
        <h2>KOD: <span id="runCode"></span></h2>
        <h2 id="runInfo">Oczekiwanie...</h2>
        <p id="finishInfo"></p>
    </section>

    <section id="results" class="hidden">
        <h1>🏆 WYNIKI</h1>
        <div id="podium"></div>
    </section>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://megktvolzzqkeykzjkhe.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_qL5wS3xcDN8CbnUQ-Uvusw_zVxoBOMH";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const BASE_JOIN_URL = "https://projektbiz.github.io/projekt.biz/gra.html";

let room = null;
let poll = null;
let finishing = false;

const $ = id => document.getElementById(id);

function esc(value) {
    return String(value).replace(/[&<>"']/g, m => ({
        "&": "&amp;","<": "&lt;",">": "&gt;",'"': "&quot;","'": "&#039;"
    }[m]));
}

function makeCode() {
    return Math.random().toString(36).slice(2, 8).toUpperCase();
}

function getJoinUrl(code) {
    const u = new URL(BASE_JOIN_URL);
    if (code) {
        u.searchParams.set("code", code);
    }
    return u.href;
}

function makeQR(code) {
    const box = $("qrcode");
    if (!box) return;

    const fullUrl = getJoinUrl(code);
    const qrApiUrl = "https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=" + encodeURIComponent(fullUrl) + "&margin=10";

    box.innerHTML = '<img src="' + qrApiUrl + '" alt="Kod QR" width="220" height="220" style="display:block; border-radius:12px; margin:auto;" />';
    $("joinUrl").textContent = fullUrl;
}

async function createRoom() {
    const localCode = makeCode();
    $("code").textContent = localCode;
    makeQR(localCode);
    $("status").textContent = "Zapisywanie pokoju w bazie...";

    const timeoutPromise = new Promise((_, reject) =>
        setTimeout(() => reject(new Error("Brak odpowiedzi z bazy (limit 6s). Sprawdź czy projekt na Supabase nie jest uśpiony (Paused).")), 6000)
    );

    try {
        const insertPromise = sb
            .from("rooms")
            .insert({
                code: localCode,
                status: "lobby",
                current_question: 0
            })
            .select("code,status,current_question")
            .single();

        const { data, error } = await Promise.race([insertPromise, timeoutPromise]);

        if (error) {
            console.error("Błąd Supabase:", error);
            $("status").innerHTML = '<span style="color:#ef4444; font-weight:bold;">Błąd bazy: ' + error.message + '</span>';
            return;
        }

        room = data;
        $("code").textContent = room.code;
        makeQR(room.code);
        $("status").textContent = "Zeskanuj kod QR aparatem w telefonie, aby dołączyć.";

        clearInterval(poll);
        poll = setInterval(refreshLobby, 1000);
        refreshLobby();

    } catch (err) {
        console.error("Błąd połączenia:", err);
        $("status").innerHTML = '<span style="color:#ef4444; font-weight:bold;">' + err.message + '</span>';
    }
}

async function refreshLobby() {
    if (!room || room.status !== "lobby") return;

    const { data: ps, error } = await sb
        .from("players")
        .select("id,nickname,finished,score")
        .eq("room_code", room.code)
        .order("joined_at", { ascending: true });

    if (error) {
        console.error("Błąd odczytu graczy:", error.message);
        return;
    }

    const arr = ps || [];
    $("playerCount").textContent = arr.length + " " + (arr.length === 1 ? "gracz" : "graczy");

    $("players").innerHTML = arr.map(p =>
        '<div class="player">👤 ' + esc(p.nickname) + '</div>'
    ).join("");

    $("start").disabled = arr.length === 0;
}

$("start").onclick = async () => {
    if (!room) return;

    $("start").disabled = true;
    $("status").textContent = "Uruchamianie quizu...";

    const { data, error } = await sb
        .from("rooms")
        .update({ status: "playing", current_question: 0 })
        .eq("code", room.code)
        .select("code,status,current_question")
        .single();

    if (error) {
        $("status").textContent = "Błąd uruchomienia: " + error.message;
        $("start").disabled = false;
        return;
    }

    room = data;
    $("lobby").classList.add("hidden");
    $("running").classList.remove("hidden");
    $("runCode").textContent = room.code;

    clearInterval(poll);
    poll = setInterval(refreshPlaying, 1000);
    refreshPlaying();
};

async function refreshPlaying() {
    if (!room) return;

    const { data: r } = await sb
        .from("rooms")
        .select("code,status,current_question")
        .eq("code", room.code)
        .maybeSingle();

    if (!r) return;
    room = r;

    if (r.status === "finished") {
        clearInterval(poll);
        showResults();
        return;
    }

    const { data: ps, error } = await sb
        .from("players")
        .select("id,nickname,finished,score")
        .eq("room_code", room.code);

    if (error) return;

    const arr = ps || [];
    const done = arr.filter(p => p.finished).length;

    $("runInfo").textContent = "Ukończyło: " + done + "/" + arr.length;
    $("finishInfo").textContent = arr.length
        ? (done === arr.length ? "Wszyscy ukończyli — wyniki za chwilę..." : "Uczniowie rozwiązują quiz niezależnie.")
        : "";

    if (arr.length && done === arr.length && !finishing) {
        finishing = true;
        const { error: ue } = await sb
            .from("rooms")
            .update({ status: "finished" })
            .eq("code", room.code);

        if (!ue) showResults();
    }
}

async function showResults() {
    $("lobby").classList.add("hidden");
    $("running").classList.add("hidden");
    $("results").classList.remove("hidden");

    const { data: ps } = await sb
        .from("players")
        .select("nickname,score")
        .eq("room_code", room.code)
        .order("score", { ascending: false })
        .limit(3);

    const labels = ["🥇", "🥈", "🥉"];
    const classes = ["p1", "p2", "p3"];

    $("podium").innerHTML = "";

    (ps || []).forEach((p, i) => {
        const d = document.createElement("div");
        d.className = "place " + classes[i];
        d.innerHTML =
            '<div class="name">' + labels[i] + ' ' + esc(p.nickname) + '</div>' +
            '<div class="block">' + (i + 1) + '</div>' +
            '<div class="score">' + (p.score || 0) + ' pkt</div>';
        $("podium").appendChild(d);
    });
}

createRoom();
</script>

</body>
</html>
